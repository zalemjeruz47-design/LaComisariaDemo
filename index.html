<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Comisaría - Demo</title>
<style>body{background:#0b1a33;color:white;font-family:sans-serif;padding:20px;text-align:center}h1{color:#38bdf8}.card{background:#122a4d;padding:20px;border-radius:16px;margin:15px 0}button{background:#38bdf8;border:0;padding:12px 20px;border-radius:12px;font-size:16px}</style></head>
<body><h1>✨ LA COMISARÍA</h1><p>ComisariaBot V3.0 - Demo Pública</p>
<div class="card"><h2>🛒 Carrito: <span id="cart">0</span></h2><p>Balón de fútbol - HNL 550.00</p><button onclick="agregar()">Agregar</button></div>
<div class="card" id="msg">¡Hola! Soy ComisariaBot. Ya estoy en vivo.</div>
<script>let c=0;function agregar(){c++;document.getElementById('cart').innerText=c;document.getElementById('msg').innerText='✅ Agregaste 1 producto. Llevás '+c;}</script>
</body></html>
